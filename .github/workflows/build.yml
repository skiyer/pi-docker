name: Build Pi image

# 触发方式：
#  1) Dependabot 开 PR → 自动合并 → 由 automerge-dependabot.yml 以可复用工作流调用本工作流
#  2) 手动触发（可指定版本；force 可在 Dockerfile 变更后用同一版本强制重建）
#  3) push 到 main 且改动了 Dockerfile / package.json / 本工作流时，按 package.json 的版本构建
on:
  workflow_dispatch:
    inputs:
      version:
        description: "要构建的 Pi 版本（留空=使用 npm 最新版）"
        required: false
        type: string
      force:
        description: "即使该版本镜像已存在也重新构建（用于 Dockerfile 变更）"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        description: "要构建的 Pi 版本"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - Dockerfile
      - package.json          # Dependabot 升级 package.json 后合并 → 触发构建
      - .github/workflows/build.yml

permissions:
  contents: read
  packages: write

env:
  UPSTREAM: "@earendil-works/pi-coding-agent"
  IMAGE: ghcr.io/${{ github.repository_owner }}/pi-docker

jobs:
  resolve:
    name: 解析版本并检查是否已构建
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      is_latest: ${{ steps.check.outputs.is_latest }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v4      # 需要 package.json 来解析版本

      - name: 登录 GHCR（用于查询已有 tag）
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: check
        name: 查询 npm 最新版并与 GHCR 比对
        run: |
          set -euo pipefail
          latest="$(npm view "$UPSTREAM" version)"
          want="${{ inputs.version }}"
          # version 输入为空时以 package.json 为准（Dependabot 维护它，保证构建版本确定可复现）
          [ -z "$want" ] && want="$(jq -r '.dependencies["@earendil-works/pi-coding-agent"]' package.json | tr -d '^~')"

          echo "version=$want" >> "$GITHUB_OUTPUT"
          [ "$want" = "$latest" ] && echo "is_latest=true" >> "$GITHUB_OUTPUT" || echo "is_latest=false" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "  force=true，强制构建 $IMAGE:$want"
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif docker manifest inspect "$IMAGE:$want" >/dev/null 2>&1; then
            echo "  $IMAGE:$want 已存在，跳过构建"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "  需要构建 $IMAGE:$want（npm latest=$latest）"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: 构建并推送多架构镜像
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 组装 tags
        id: tags
        run: |
          set -euo pipefail
          v="${{ needs.resolve.outputs.version }}"
          tags="$IMAGE:$v"
          if [ "${{ needs.resolve.outputs.is_latest }}" = "true" ]; then
            tags="$tags"$'\n'"$IMAGE:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            PI_VERSION=${{ needs.resolve.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: 输出摘要
        run: |
          {
            echo "### 已构建 Pi 镜像"
            echo ""
            echo "- 版本：\`${{ needs.resolve.outputs.version }}\`"
            echo "- 平台：linux/amd64, linux/arm64"
            echo "- 拉取：\`docker pull $IMAGE:${{ needs.resolve.outputs.version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
