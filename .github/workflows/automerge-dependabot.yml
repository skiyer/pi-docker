name: Auto-merge dependency PRs

# 方案 A：Dependabot 发现上游新版本 → 开 PR → 本工作流校验并自动合并（由 GitHub 执行合并，
# 因此合并后的 push 会正常触发 build.yml 构建镜像）。
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: write
  pull-requests: write

# 同一个 PR 只跑一次（opened 与 labeled 会同时触发，否则合并步骤会互相踩）
concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate:
    name: 校验版本可用
    if: >-
      github.actor == 'dependabot[bot]' ||
      contains(github.event.pull_request.labels.*.name, 'automerge')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: 读取目标版本并确认 npm 上存在
        id: v
        run: |
          set -euo pipefail
          v="$(jq -r '.dependencies["@earendil-works/pi-coding-agent"]' package.json | tr -d '^~')"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          npm view "@earendil-works/pi-coding-agent@$v" version

      - name: 用该版本构建一次（单架构、不推送）验证 Dockerfile 可用
        run: |
          set -euo pipefail
          docker build --build-arg "PI_VERSION=${{ steps.v.outputs.version }}" -t pi-docker:pr-validate .
          docker run --rm pi-docker:pr-validate --version

  merge:
    name: 合并 PR
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.validate.outputs.version }}
    steps:
      - name: 合并（squash，幂等）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          state="$(gh pr view "$PR" --json state --jq .state)"
          if [ "$state" = "MERGED" ]; then
            echo "PR 已合并，跳过"; exit 0
          fi
          if ! gh pr merge --squash "$PR"; then
            # 并发合并时 GitHub 会返回 merge already in progress；确认最终状态后放行
            final="$(gh pr view "$PR" --json state --jq .state)"
            [ "$final" = "MERGED" ] || { echo "合并失败（state=$final）"; exit 1; }
            echo "并发合并已由另一个运行完成"
          fi

  # 说明：用 GITHUB_TOKEN 合并产生的 push 不会再触发其他工作流（GitHub 的递归保护），
  # 因此这里直接以可复用工作流的方式调用构建，保证"发版即出镜像"。
  build:
    name: 触发镜像构建
    needs: [validate, merge]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.validate.outputs.version }}
